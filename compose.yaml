services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: games
      POSTGRES_USER: games
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-games}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U games -d games"]
      interval: 3s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build: ./backend
    environment:
      DATABASE_URL: "host=db dbname=games user=games password=${POSTGRES_PASSWORD:-games} sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:80"
volumes:
  pgdata:
