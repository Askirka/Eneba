limit_req_zone $binary_remote_addr zone=account_attempts:1m rate=15r/m;

server {
    listen 80;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=2s ipv6=off;
    set $api http://api:8080;

    location ~ ^/api/auth/(register|login)$ {
        limit_req zone=account_attempts burst=12 nodelay;
        limit_req_status 429;
        proxy_pass $api;
    }

    location /api/ { proxy_pass $api; }
    location / { try_files $uri $uri/ /index.html; }
}
